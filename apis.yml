aid: advano
name: Advano
description: Advano is a New Orleans, Louisiana battery-materials company that develops silicon-based
  anode materials for lithium-ion batteries. Spun out of Tulane University in 2016 and backed by 25+
  patents, its flagship REALSi silicon-carbon composite is engineered as a drop-in replacement for
  graphite anodes, delivering up to 9x the energy density of graphite for electric vehicles, consumer
  electronics, defense, and grid energy storage. Advano's process avoids hazardous silane gas, uses
  abundant metallurgical-grade silicon, and runs on existing manufacturing equipment. The company
  operates a pilot plant in New Orleans East and is scaling toward 3,000 tons of REALSi in 2026 and
  20,000 tons by 2030. This is a physical deep-tech manufacturer with no public API or developer
  platform; it is catalogued in the API Evangelist network as a VC portfolio company profile.
